    <text x="372" y="934" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.5" fill="#0b3a6f">PROYECTOS QUE GENERAN IMPACTO</text>

    <!-- Bloque 2 -->
    <rect x="640" y="840" width="488" height="120" rx="16" fill="#f5f9fd" stroke="#d7e6f5" stroke-width="2"/>
