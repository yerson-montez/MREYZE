  <line x1="380" y1="1690" x2="860" y2="1690" stroke="#d7e6f5" stroke-width="2"/>
  <text x="620" y="1722" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="1" fill="#9aa8ba">MREYZE · AUTOMATIZACIÓN Y SISTEMAS S.A.C. · RUC 20615935019</text>
