    <g transform="translate(884,876)">
      <path d="M0 -14 L11 -10 L11 2 C11 9 5 13 0 15 C-5 13 -11 9 -11 2 L-11 -10 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <polyline points="-5,0 -1,5 6,-3" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="884" y="934" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.5" fill="#0b3a6f">CONFIANZA Y TRANSPARENCIA</text>

    <!-- Bloque 3 -->
    <rect x="128" y="984" width="488" height="120" rx="16" fill="#f5f9fd" stroke="#d7e6f5" stroke-width="2"/>
    <rect x="348" y="996" width="48" height="48" rx="12" fill="#0b3a6f"/>
    <g transform="translate(372,1020)" fill="none" stroke="#ffffff" stroke-width="2.5">
      <circle cx="0" cy="0" r="12"/>
      <circle cx="0" cy="0" r="7"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" stroke="none"/>
    </g>
    <text x="372" y="1078" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.5" fill="#0b3a6f">COMPROMISO TOTAL</text>

    <!-- Bloque 4 -->
    <rect x="640" y="984" width="488" height="120" rx="16" fill="#f5f9fd" stroke="#d7e6f5" stroke-width="2"/>
    <rect x="860" y="996" width="48" height="48" rx="12" fill="#0b3a6f"/>
    <g transform="translate(884,1020)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-12,10 -3,0 4,4 12,-6"/>
      <polyline points="5,-6 12,-6 12,1"/>
    </g>
    <text x="884" y="1078" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="1.5" fill="#0b3a6f">CRECIMIENTO JUNTOS</text>
  </g>

  <!-- ═══════════════ CANALES OFICIALES ═══════════════ -->
  <rect x="360" y="1170" width="520" height="200" rx="18" fill="#f5f9fd" stroke="#d7e6f5" stroke-width="2"/>
  <text x="620" y="1212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#0b3a6f">CANALES OFICIALES</text>
  <line x1="400" y1="1232" x2="840" y2="1232" stroke="#d7e6f5" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#1f3a5f">
    <!-- Gmail -->
    <g transform="translate(400,1260)" fill="none" stroke="#0b3a6f" stroke-width="2.5">
      <rect x="-12" y="-8" width="24" height="16" rx="3"/>
      <polyline points="-12,-8 0,2 12,-8"/>
    </g>
    <text x="450" y="1268">Gmail:  mreyze.sac@gmail.com</text>
    <!-- Sitio web -->
    <g transform="translate(400,1305)" fill="none" stroke="#0b3a6f" stroke-width="2.5">
      <circle cx="0" cy="0" r="12"/>
      <ellipse cx="0" cy="0" rx="5.5" ry="12"/>
      <line x1="-12" y1="0" x2="12" y2="0"/>
    </g>
    <text x="450" y="1313">Sitio web:  mreyze.up.railway.app</text>
    <!-- TikTok -->
    <g transform="translate(400,1350)" fill="none" stroke="#0b3a6f" stroke-width="2.5" stroke-linecap="round">
      <ellipse cx="-8" cy="8" rx="4.5" ry="3.5" fill="#0b3a6f" stroke="none"/>
      <path d="M-8 8 L-8 -6 L6 -9 L6 4"/>
      <ellipse cx="6" cy="4" rx="4.5" ry="3.5" fill="#0b3a6f" stroke="none"/>
    </g>
    <text x="450" y="1358">TikTok:  @veente20</text>
  </g>

  <!-- ═══════════════ DATOS DE LA EMPRESA ═══════════════ -->
  <line x1="200" y1="1504" x2="566" y2="1504" stroke="#0b3a6f" stroke-width="2.5"/>
  <text x="200" y="1538" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#0b3a6f">MreyZe Automatización y Sistemas S.A.C.</text>
  <text x="200" y="1574" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#5b6f87">RUC: 20615935019</text>

