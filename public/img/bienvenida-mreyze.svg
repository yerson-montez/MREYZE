<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 1754" width="1240" height="1754">
  <defs>
    <linearGradient id="barraAzul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b3a6f"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>
  </defs>

  <!-- Fondo del documento -->
  <rect x="0" y="0" width="1240" height="1754" fill="#ffffff"/>

  <!-- ═══════════════ MEMBRETE ═══════════════ -->
  <image x="568" y="64" width="104" height="93" href="LOGOMREYZE1.png" preserveAspectRatio="xMidYMid meet"/>
  <text x="620" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="10" fill="#0b3a6f">MREYZE</text>
  <text x="620" y="252" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="5" fill="#5b6f87">AUTOMATIZACIÓN Y SISTEMAS S.A.C.</text>
  <text x="620" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8a97a8">RUC 20615935019</text>

  <rect x="200" y="312" width="840" height="6" rx="3" fill="url(#barraAzul)"/>
  <line x1="120" y1="326" x2="1120" y2="326" stroke="#d7e6f5" stroke-width="2"/>

  <!-- ═══════════════ TÍTULO ═══════════════ -->
  <text x="620" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="2" fill="#0b3a6f">¡BIENVENIDO!</text>
  <text x="620" y="466" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#3a5570">Gracias por confiar en nosotros</text>

  <!-- ═══════════════ MENSAJE ═══════════════ -->
  <text x="180" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#2b3f57">Estimado(a) inversionista:</text>
  <text x="180" y="590" width="880" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#2b3f57">
    <tspan x="180" dy="0">Le damos la más cordial bienvenida a la familia MreyZe. Su confianza es el motor</tspan>
    <tspan x="180" dy="34">que nos impulsa a seguir desarrollando proyectos tecnológicos con un impacto real</tspan>
    <tspan x="180" dy="34">en la sociedad. Gracias por creer en nosotros y por ser parte de este camino.</tspan>
    <tspan x="180" dy="34">Su inversión hoy es la semilla de las soluciones que transforman el mañana.</tspan>
  </text>

  <!-- ═══════════════ FRASE ═══════════════ -->
  <line x1="150" y1="782" x2="430" y2="782" stroke="#cfe0f0" stroke-width="2"/>
  <text x="620" y="794" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-style="italic" fill="#0088cc">“Crece con nosotros, invierte en el futuro.”</text>
  <line x1="810" y1="782" x2="1090" y2="782" stroke="#cfe0f0" stroke-width="2"/>

  <!-- ═══════════════ BLOQUES ═══════════════ -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Bloque 1 -->
    <rect x="128" y="840" width="488" height="120" rx="16" fill="#f5f9fd" stroke="#d7e6f5" stroke-width="2"/>
    <rect x="348" y="852" width="48" height="48" rx="12" fill="#0b3a6f"/>
    <g stroke="#ffffff" stroke-width="2" fill="none" transform="translate(372,876)">
